; Example only: install/adapt outside the repository through normal deployment.
[program:project13-yandex]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/project13
command=/usr/bin/php artisan queue:work database --queue=yandex --sleep=1 --timeout=330 --max-time=3600
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=390
redirect_stderr=true
stdout_logfile=/var/www/project13/storage/logs/yandex-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:project13-scheduler]
directory=/var/www/project13
command=/usr/bin/php artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/project13/storage/logs/scheduler.log
